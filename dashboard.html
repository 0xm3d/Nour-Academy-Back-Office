<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Academy | Dashboard</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script type="module" src="src/ui/table.js"></script>
</head>
<body>
    
<!-- Dashboard content -->
<main class="p-6">

        <!-- Dashboard Filters - Fatima -->
        <section class="rounded-xl bg-[#f7f6ed] p-6">

            <div class="flex flex-col justify-between gap-4 md:flex-row md:items-center">

                <div>
                    <h1 class="text-3xl font-bold">Registrations</h1>

                    <p class="mt-1 text-sm text-[#0a0ab5]">
                        24 registrations across the 3 centers
                    </p>
                </div>

                <!-- Search, Filter and Sort -->
                <div class="flex flex-wrap gap-3">

                    <input
                        type="search"
                        id="search"
                        placeholder="Search by student name or phone..."
                        class="rounded-lg border border-gray-300 bg-white px-4 py-3"
                    >

                    <select
                        id="status-filter"
                        class="rounded-lg border border-gray-300 bg-white px-4 py-3"
                    >
                        <option value="all">All statuses</option>
                        <option value="en attente">Pending</option>
                        <option value="confirmée">Confirmed</option>
                        <option value="refusée">Rejected</option>
                    </select>

                    <select
                        id="sort-by"
                        class="rounded-lg border border-gray-300 bg-white px-4 py-3 md:items-center"
                    >
                        <option value="name-asc">Name: A → Z</option>
                        <option value="name-desc">Name: Z → A</option>
                        <option value="date-desc">Newest first</option>
                        <option value="date-asc">Oldest first</option>
                    </select>

                </div>

                <!-- Dashboard Actions -->
                <div class="flex flex-wrap gap-3">

                    <button
                        type="button"
                        id="reset-demo"
                        class="rounded-lg border border-[#141097] px-5 py-3 text-sm font-medium hover:bg-[#eeeddf]"
                    >
                        Reset demo data
                    </button>

                    <button
                        type="button"
                        id="new-registration"
                        class="rounded-lg bg-[#141097] px-5 py-3 text-sm font-medium text-white hover:bg-[#0a0a80]"
                    >
                        + New Registration
                    </button>

                </div>

            </div>
        </section>
        <!-- End of Dashboard Filters -->





    <section>
        <h1 class="mb-4 text-2xl font-bold">
        Registrations
    </h1>

    <p id="registrations-count" class="mb-4 text-sm text-gray-500">
        Loading registrations...
    </p>

    <div class="overflow-x->auto rounded-xl border border-[var(--color-soft)] bg-white">
        <table class="w-full min-w-[768px] text-left">
            <thead class="bg-[var(--color-soft)] text-xs uppercase">
                <tr>
                    <th class="px-4 py-3">File no.</th>
                    <th class="px-4 py-3">Student</th>
                    <th class="px-4 py-3">Level</th>
                    <th class="px-4 py-3">Course</th>
                    <th class="px-4 py-3">Parent phone</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3">Date</th>
                </tr>
            </thead>

            <tbody id="registrations-body"></tbody>
        </table>
    </div>
    </section>

</main>

</body>
</html>
